[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-turnpike-wh"
version = "0.1.0"
description = "Research on gradient approximation in truncated backpropagation through time"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "nonlinear-benchmarks==1.0.1",
    "torch>=2.0,<3",
    "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
